name: Release

# Push a tag like v3.0.0: tests run, then one zip per architecture goes to a new draft GitHub release.
# Polish the notes, then publish: the in-app update check ignores drafts.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: pwsh
    working-directory: src

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags + history for the release notes

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: |
          dotnet build Unlocker.slnx -c Release
          dotnet test ../tests/Unlocker.Tests -c Release --no-build

      # The tag sets the app version: the in-app update check compares it with the latest release tag.
      - name: Publish and zip
        run: |
          $version = $env:TAG.TrimStart('v')
          foreach ($arch in 'x64', 'ARM64') {
            $out = "../out/$arch"
            dotnet publish Unlocker.WinUI -c Release -p:Platform=$arch -p:Version=$version -o $out
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Compress-Archive "$out/*" "../out/AdobeCameraProfilesUnlocker-$version-win-$($arch.ToLower()).zip"
          }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ../.github/release-notes.ps1 -Tag $env:TAG -Repo $env:GITHUB_REPOSITORY | Set-Content ../out/notes.md
          gh release create $env:TAG ../out/*.zip --draft --verify-tag --title $env:TAG --notes-file ../out/notes.md
